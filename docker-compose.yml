services:
  backend:
    build:
      context: ./backend
    container_name: board-game-backend
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    env_file:
      - ./backend/.env

  frontend:
    build:
      context: ./frontend
    container_name: board-game-frontend
    ports:
      - "${FRONTEND_CONTAINER_PORT:-8080}:80"
    depends_on:
      - backend

